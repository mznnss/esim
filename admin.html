<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard - Verifikasi eSIM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-100 p-6 min-h-screen text-slate-800">

  <div class="max-w-5xl mx-auto">
    <div class="flex justify-between items-center mb-6">
      <div>
        <h1 class="text-2xl font-black text-slate-900">Admin Panel - Transaksi Masuk</h1>
        <p class="text-xs text-slate-500">Cek mutasi m-banking Anda, lalu klik Verifikasi Lunas</p>
      </div>
      <button onclick="loadOrders()" class="bg-slate-900 text-white text-xs px-4 py-2 rounded-xl font-bold hover:bg-slate-800 transition">
        🔄 Refresh Data
      </button>
    </div>

    <!-- Tabel Pesanan -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
      <table class="w-full text-left text-sm">
        <thead class="bg-slate-50 border-b border-slate-200 text-xs font-bold text-slate-500">
          <tr>
            <th class="p-4">Jam</th>
            <th class="p-4">Order ID</th>
            <th class="p-4">Paket</th>
            <th class="p-4">Nominal</th>
            <th class="p-4">Email Pembeli</th>
            <th class="p-4">Status</th>
            <th class="p-4 text-center">Aksi</th>
          </tr>
        </thead>
        <tbody id="orders-table-body" class="divide-y divide-slate-100 font-medium">
          <!-- Row pesanan akan di-render di sini via JS -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    async function loadOrders() {
      try {
        const res = await fetch('http://localhost:3000/api/admin/orders');
        const orders = await res.json();
        const tbody = document.getElementById('orders-table-body');
        tbody.innerHTML = '';

        if (orders.length === 0) {
          tbody.innerHTML = `<tr><td colspan="7" class="text-center p-6 text-xs text-slate-400">Belum ada pesanan masuk.</td></tr>`;
          return;
        }

        orders.forEach(o => {
          const isPaid = o.status === 'PAID';
          tbody.innerHTML += `
            <tr class="hover:bg-slate-50 transition">
              <td class="p-4 text-xs text-slate-400">${o.created_at}</td>
              <td class="p-4 font-mono text-xs font-bold text-slate-700">${o.order_id}</td>
              <td class="p-4 text-xs">${o.package_name}</td>
              <td class="p-4 font-bold text-indigo-600">Rp ${o.price.toLocaleString('id-ID')}</td>
              <td class="p-4 text-xs font-semibold text-slate-700">${o.email}</td>
              <td class="p-4">
                <span class="px-2.5 py-1 text-[11px] rounded-full font-bold ${isPaid ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">
                  ${o.status}
                </span>
              </td>
              <td class="p-4 text-center">
                ${!isPaid 
                  ? `<button onclick="verifyOrder('${o.order_id}')" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition">
                      Verifikasi Lunas
                     </button>` 
                  : `<span class="text-xs text-slate-400 font-semibold">Telah Lunas</span>`
                }
              </td>
            </tr>
          `;
        });
      } catch (err) {
        console.error(err);
      }
    }

    async function verifyOrder(orderId) {
      await fetch(`http://localhost:3000/api/admin/verify/${orderId}`, { method: 'POST' });
      loadOrders(); // Refresh table
    }

    // Auto-refresh daftar pesanan tiap 3 detik
    setInterval(loadOrders, 3000);
    loadOrders();
  </script>
</body>
</html>
