<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard - Verifikasi Bukti Bayar eSIM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-100 p-4 sm:p-8 min-h-screen text-slate-800">

  <div class="max-w-6xl mx-auto">
    
    <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-4 mb-6">
      <div>
        <div class="flex items-center gap-2">
          <span class="bg-indigo-600 text-white p-1.5 rounded-lg"><i data-lucide="shield-check" class="w-4 h-4"></i></span>
          <h1 class="text-2xl font-black text-slate-900">Dashboard Admin eSIM</h1>
        </div>
        <p class="text-xs text-slate-500 mt-1">Periksa bukti struk pembayaran dan verifikasi lunas.</p>
      </div>

      <button onclick="loadOrders()" class="self-start sm:self-auto bg-slate-900 hover:bg-slate-800 text-white text-xs px-4 py-2.5 rounded-xl font-bold transition flex items-center gap-1.5">
        <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> Refresh Data
      </button>
    </div>

    <!-- Tabel Transaksi -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="bg-slate-50 border-b border-slate-200 text-xs font-bold text-slate-500">
            <tr>
              <th class="p-4">Waktu</th>
              <th class="p-4">Order ID</th>
              <th class="p-4">Paket eSIM</th>
              <th class="p-4">Nominal</th>
              <th class="p-4">Email Pembeli</th>
              <th class="p-4 text-center">Bukti Bayar</th>
              <th class="p-4 text-center">Status</th>
              <th class="p-4 text-center">Aksi</th>
            </tr>
          </thead>
          <tbody id="orders-table-body" class="divide-y divide-slate-100 font-medium"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal Preview Foto Bukti Transfer -->
  <div id="image-modal" class="fixed inset-0 z-50 bg-slate-900/75 backdrop-blur-sm hidden items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-sm w-full p-5 shadow-2xl relative text-center">
      <button onclick="closeImageModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>

      <h4 class="text-sm font-bold text-slate-800 mb-3">Foto Bukti Pembayaran</h4>
      <div class="bg-slate-50 p-2 rounded-2xl border border-slate-200 mb-2">
        <img id="modal-proof-img" src="" class="w-full h-auto max-h-[65vh] object-contain rounded-xl" />
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();
    let currentOrders = [];

    async function loadOrders() {
      try {
        const res = await fetch('/api/admin');
        currentOrders = await res.json();
        const tbody = document.getElementById('orders-table-body');
        tbody.innerHTML = '';

        if (currentOrders.length === 0) {
          tbody.innerHTML = `<tr><td colspan="8" class="text-center p-8 text-xs text-slate-400">Belum ada pesanan masuk.</td></tr>`;
          return;
        }

        currentOrders.forEach((o, index) => {
          const isPaid = o.status === 'PAID';
          const hasProof = o.proof_image !== null;

          tbody.innerHTML += `
            <tr class="hover:bg-slate-50 transition">
              <td class="p-4 text-xs text-slate-400 whitespace-nowrap">${o.created_at}</td>
              <td class="p-4 font-mono text-xs font-bold text-slate-800 whitespace-nowrap">${o.order_id}</td>
              <td class="p-4 text-xs whitespace-nowrap">${o.package_name}</td>
              <td class="p-4 font-bold text-indigo-600 whitespace-nowrap">Rp ${o.price.toLocaleString('id-ID')}</td>
              <td class="p-4 text-xs font-semibold text-slate-700 whitespace-nowrap">${o.email}</td>
              <td class="p-4 text-center whitespace-nowrap">
                ${hasProof 
                  ? `<button onclick="viewImage(${index})" class="bg-indigo-50 text-indigo-700 hover:bg-indigo-100 text-xs font-bold px-3 py-1.5 rounded-lg transition inline-flex items-center gap-1">
                      <i data-lucide="image" class="w-3.5 h-3.5"></i> Lihat Bukti
                     </button>` 
                  : `<span class="text-[11px] text-slate-400 italic">Belum kirim</span>`
                }
              </td>
              <td class="p-4 text-center whitespace-nowrap">
                <span class="px-2.5 py-1 text-[11px] rounded-full font-bold ${isPaid ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">
                  ${o.status}
                </span>
              </td>
              <td class="p-4 text-center whitespace-nowrap">
                ${!isPaid 
                  ? `<button onclick="verifyOrder('${o.order_id}')" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3.5 py-1.5 rounded-lg transition shadow-sm">
                      Verifikasi Lunas
                     </button>` 
                  : `<span class="text-xs text-emerald-600 font-bold inline-flex items-center gap-1"><i data-lucide="check" class="w-3.5 h-3.5"></i> Selesai</span>`
                }
              </td>
            </tr>
          `;
        });
        lucide.createIcons();
      } catch (err) {
        console.error('Error fetching admin orders:', err);
      }
    }

    function viewImage(index) {
      document.getElementById('modal-proof-img').src = currentOrders[index].proof_image;
      document.getElementById('image-modal').classList.remove('hidden');
      document.getElementById('image-modal').classList.add('flex');
      lucide.createIcons();
    }

    function closeImageModal() {
      document.getElementById('image-modal').classList.add('hidden');
      document.getElementById('image-modal').classList.remove('flex');
    }

    async function verifyOrder(orderId) {
      await fetch('/api/admin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ orderId })
      });
      loadOrders();
    }

    setInterval(loadOrders, 3000);
    loadOrders();
  </script>
</body>
</html>
